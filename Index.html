<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sev-1 Notifier — Avaya Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --avaya-red: #CC0000;
    --avaya-red-dark: #A30000;
    --avaya-red-light: #FCEBE8;
    --avaya-dark: #0F1720;
    --slate-800: #1B2733;
    --slate-700: #263341;
    --slate-500: #5A6B80;
    --slate-300: #94A3B5;
    --slate-100: #E7ECF1;
    --paper: #F4F6F8;
    --white: #FFFFFF;
    --sev1: #CC0000;
    --sev1-bg: #FCEBE8;
    --sev2: #C77E1E;
    --sev2-bg: #FDF3E3;
    --ok: #2E7D4F;
    --ok-bg: #E7F5EC;
    --whatsapp-green: #25D366;
    --whatsapp-chat-bg: #E5DDD5;
    --mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; width: 100vw; background: var(--paper); font-family: var(--sans); color: var(--avaya-dark); -webkit-font-smoothing: antialiased; }

  /* Full Screen Login Overlay Guard */
  #authScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--avaya-dark) 0%, #1B2A3D 100%);
    padding: 24px;
    z-index: 999999;
  }

  .auth-card {
    background: var(--white);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    border-top: 4px solid var(--avaya-red);
  }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .auth-brand-mark {
    width: 40px; height: 40px; border-radius: 6px; background: var(--avaya-red);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: var(--white);
  }
  .auth-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; color: var(--avaya-dark); }
  .auth-sub { font-size: 13px; color: var(--slate-500); margin-bottom: 26px; line-height: 1.5; }
  .auth-field-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-500); margin-bottom: 6px; }
  .auth-input { width: 100%; font-family: var(--sans); font-size: 14px; padding: 12px 14px; border: 1px solid var(--slate-100); border-radius: 6px; margin-bottom: 12px; }
  .auth-btn { width: 100%; font-family: var(--sans); font-weight: 800; font-size: 14.5px; padding: 13px 18px; border-radius: 6px; border: none; cursor: pointer; background: var(--avaya-red); color: var(--white); }
  .auth-btn:hover { background: var(--avaya-red-dark); }
  .auth-error { font-size: 12.5px; color: var(--avaya-red); margin-bottom: 10px; min-height: 16px; font-weight: 600; }

  /* App Workspace Styling */
  .topbar {
    background: var(--avaya-dark);
    color: var(--white);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--avaya-red);
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 4px;
    background: var(--avaya-red);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--sans); font-weight: 900; font-size: 13px; color: var(--white);
    flex-shrink: 0;
  }
  .brand-sub { color: var(--slate-300); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--slate-300); flex-wrap: wrap; justify-content: flex-end; }
  
  .nav-btn {
    background: none; border: 1px solid var(--slate-700); color: var(--white);
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    padding: 7px 13px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; transition: all 0.15s ease-in-out;
  }
  .nav-btn:hover { background: var(--slate-800); border-color: var(--slate-500); }
  .nav-btn.primary-nav { background: var(--avaya-red); border-color: var(--avaya-red); }
  .nav-btn.primary-nav:hover { background: var(--avaya-red-dark); border-color: var(--avaya-red-dark); }
  
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--slate-800); padding: 5px 11px; border-radius: 20px;
    font-size: 11.5px; font-family: var(--mono); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

  .shell { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 57px); }
  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--slate-100);
    padding: 20px 0;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 0 20px 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-title { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate-500); }
  .count-badge { font-family: var(--mono); font-size: 11px; background: var(--sev1-bg); color: var(--sev1); padding: 2px 8px; border-radius: 10px; font-weight: 700; }

  .incident-card {
    padding: 14px 20px;
    border-left: 4px solid transparent;
    border-bottom: 1px solid var(--slate-100);
    cursor: pointer;
    transition: background 0.15s;
  }
  .incident-card:hover { background: var(--paper); }
  .incident-card.active { background: #FDF4F4; border-left-color: var(--avaya-red); }
  .incident-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sev-badge {
    font-family: var(--mono); font-size: 10.5px; font-weight: 800;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 0.03em;
  }
  .sev-badge.sev1 { background: var(--sev1-bg); color: var(--sev1); }
  .sev-badge.sev2 { background: var(--sev2-bg); color: var(--sev2); }
  .incident-id { font-family: var(--mono); font-size: 11px; color: var(--slate-500); }
  .incident-title { font-size: 13.5px; font-weight: 700; color: var(--avaya-dark); margin-bottom: 4px; line-height: 1.35; }
  .incident-meta { font-size: 11.5px; color: var(--slate-500); display: flex; align-items: center; gap: 6px; }
  .src-tag {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    background: var(--slate-100); color: var(--slate-700); padding: 1px 6px; border-radius: 3px; font-weight: 600;
  }

  .main { padding: 26px 34px; max-width: 980px; }
  .breadcrumb { font-size: 12px; color: var(--slate-500); margin-bottom: 10px; font-family: var(--mono); }
  .main-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 20px; }
  .main-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 6px 0; color: var(--avaya-dark); }
  .main-sub { font-size: 13.5px; color: var(--slate-500); display: flex; gap: 14px; flex-wrap: wrap; }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--white); border: 1px solid var(--slate-100); border-radius: 8px;
    padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 18px;
  }
  .kpi-card.p1 { border-left: 5px solid var(--avaya-red); }
  .kpi-card.p2 { border-left: 5px solid var(--sev2); }
  .kpi-val { font-size: 36px; font-weight: 900; font-family: var(--mono); line-height: 1; }
  .kpi-card.p1 .kpi-val { color: var(--avaya-red); }
  .kpi-card.p2 .kpi-val { color: var(--sev2); }
  .kpi-title { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--avaya-dark); letter-spacing: 0.05em; }
  .kpi-desc { font-size: 12px; color: var(--slate-500); margin-top: 3px; }

  .segment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 10px; }
  .segment-col {
    background: var(--white); border: 1px solid var(--slate-100); border-radius: 8px;
    padding: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border-top: 3px solid var(--avaya-dark);
  }
  .segment-col.ms { border-top-color: var(--avaya-red); }
  .segment-col.gss { border-top-color: #0A5FA8; }
  .segment-col.infinity { border-top-color: #5B3FBF; }
  .segment-header { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--avaya-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .segment-count { font-family: var(--mono); font-size: 11px; background: var(--paper); padding: 2px 7px; border-radius: 10px; color: var(--slate-500); }

  .company-card-item {
    background: var(--paper); border: 1px solid var(--slate-100); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px;
  }
  .company-card-item:last-child { margin-bottom: 0; }
  .company-name { font-weight: 700; color: var(--avaya-dark); margin-bottom: 3px; }
  .company-id-label { font-family: var(--mono); font-size: 10.5px; color: var(--slate-500); word-break: break-all; }

  .timer-box {
    background: var(--avaya-dark); color: var(--white);
    border-radius: 8px; padding: 14px 20px; text-align: center; min-width: 168px; border-top: 3px solid var(--avaya-red);
  }
  .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate-300); margin-bottom: 4px; font-weight: 700; }
  .timer-value { font-family: var(--mono); font-size: 26px; font-weight: 700; }
  .timer-value.urgent { color: #FF8A73; }

  .card {
    background: var(--white); border: 1px solid var(--slate-100); border-radius: 8px;
    padding: 22px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--slate-500); }

  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; margin-bottom: 4px; }
  .field { font-size: 13px; }
  .field-k { color: var(--slate-500); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; font-weight: 700; }
  .field-v { font-family: var(--mono); font-size: 13px; color: var(--avaya-dark); font-weight: 600; }

  .btn {
    font-family: var(--sans); font-weight: 700; font-size: 13.5px;
    padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s;
  }
  .btn-primary { background: var(--avaya-red); color: var(--white); }
  .btn-primary:hover { background: var(--avaya-red-dark); }
  .btn-secondary { background: var(--slate-100); color: var(--avaya-dark); }
  .btn-secondary:hover { background: #DCE3EA; }
  .btn-danger { background: var(--sev1-bg); color: var(--sev1); }
  .btn-danger:hover { background: #F8D7D0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .draft-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .draft-tab {
    font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 6px;
    background: var(--paper); color: var(--slate-500); cursor: pointer; border: 1px solid var(--slate-100);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .draft-tab.active-email { background: #EAF1FB; color: #0A5FA8; border-color: #B2D1F5; }
  .draft-tab.active-wa { background: #E7FCEB; color: #0B6623; border-color: #A3E9B5; }

  .draft-box {
    border: 1px solid var(--slate-100); border-radius: 8px; padding: 16px;
    font-family: var(--mono); font-size: 13px; line-height: 1.65; color: var(--avaya-dark);
    background: var(--paper); min-height: 140px; white-space: pre-wrap;
  }
  .draft-box.empty { color: var(--slate-300); font-family: var(--sans); font-style: italic; display: flex; align-items: center; justify-content: center; text-align: center; }
  .draft-box[contenteditable="true"]:focus { outline: 2px solid var(--avaya-red); outline-offset: 2px; background: var(--white); }

  .wa-preview-container {
    background: var(--whatsapp-chat-bg);
    border-radius: 8px; padding: 16px; border: 1px solid #D1C7BD; margin-bottom: 12px;
  }
  .wa-message-bubble {
    background: #FFFFFF; border-radius: 0 8px 8px 8px; padding: 12px 14px;
    max-width: 520px; font-size: 13px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .wa-header { font-weight: 800; color: var(--avaya-red); margin-bottom: 6px; font-size: 12px; border-bottom: 1px solid #F0F0F0; padding-bottom: 4px; }
  .wa-body { white-space: pre-wrap; color: #111111; font-family: var(--sans); }
  .wa-footer { font-size: 10px; color: #888888; text-align: right; margin-top: 6px; font-family: var(--mono); }
  .wa-badge { display: inline-block; background: #DCF8C6; color: #075E54; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; }

  .guardrail-note {
    display: flex; align-items: flex-start; gap: 9px; margin-top: 12px;
    font-size: 12px; color: var(--ok); background: var(--ok-bg); padding: 9px 12px; border-radius: 6px; font-weight: 600;
  }

  .action-row { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .sent-confirm { font-size: 12.5px; color: var(--ok); font-weight: 700; display: none; align-items: center; gap: 6px; }
  .sent-confirm.show { display: inline-flex; }

  .timeline { margin-top: 4px; }
  .tl-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--slate-100); }
  .tl-item:last-child { border-bottom: none; }
  .tl-time { font-family: var(--mono); font-size: 11px; color: var(--slate-500); min-width: 64px; padding-top: 1px; }
  .tl-dot-col { display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--avaya-red); margin-top: 4px; }
  .tl-text { font-size: 13px; color: var(--avaya-dark); }
  .tl-text b { font-weight: 700; }

  .recipients-box { border: 1px solid var(--slate-100); border-radius: 8px; padding: 14px 16px; margin-top: 14px; background: var(--paper); }
  .recipients-box-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .recipients-box-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--slate-500); }
  .manage-link { font-size: 12px; font-weight: 700; color: var(--avaya-red); background: none; border: none; cursor: pointer; padding: 0; }
  .manage-link:hover { text-decoration: underline; }
  .recipient-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--slate-100); font-size: 13px; }
  .recipient-row:last-child { border-bottom: none; }
  .recipient-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--avaya-red); cursor: pointer; }
  .recipient-name { font-weight: 700; flex: 0 0 auto; min-width: 130px; }
  .recipient-detail { font-family: var(--mono); font-size: 12px; color: var(--slate-500); flex: 1; }
  .tag { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 10px; }
  .tag.internal { background: #E7ECF1; color: var(--slate-700); }
  .tag.external { background: #FCEBE8; color: var(--avaya-red); }

  .company-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; background: var(--slate-100); 
    color: var(--avaya-dark); padding: 3px 8px; border-radius: 4px; margin: 2px 4px 2px 0; font-family: var(--mono);
  }
  .company-chip .remove-btn { color: var(--avaya-red); cursor: pointer; font-weight: 800; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 32, 0.65); display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: var(--white); border-radius: 10px; padding: 28px; max-width: 480px; width: 90%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3); border-top: 5px solid var(--avaya-red);
  }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--avaya-dark); margin-bottom: 8px; }
  .modal-sub { font-size: 13px; color: var(--slate-500); margin-bottom: 20px; line-height: 1.5; }

  .dashboard-wrap, .settings-wrap, .search-wrap, .admin-wrap { padding: 26px 34px; max-width: 980px; }
  .search-title, .settings-title { font-size: 22px; font-weight: 800; margin: 0 0 6px 0; color: var(--avaya-dark); }
  .search-sub, .settings-sub { font-size: 13.5px; color: var(--slate-500); }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 700; padding: 8px 16px;
    border-radius: 20px; border: 1px solid var(--slate-100); background: var(--white);
    color: var(--slate-500); cursor: pointer; transition: all 0.15s;
  }
  .mode-btn.active { background: var(--avaya-dark); border-color: var(--avaya-dark); color: var(--white); }

  .search-form { display: flex; gap: 10px; margin-bottom: 12px; }
  .search-form input[type="text"], .search-form select {
    font-family: var(--sans); font-size: 13.5px; padding: 11px 14px;
    border: 1px solid var(--slate-100); border-radius: 6px; background: var(--white);
  }
  .search-form input[type="text"] { flex: 1; font-family: var(--mono); }

  .result-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--slate-100); border-radius: 8px; margin-bottom: 8px; background: var(--white); }
  .result-main { flex: 1; }
  .result-title { font-size: 13.5px; font-weight: 700; }
  .result-meta { font-size: 12px; color: var(--slate-500); }

  .add-contact-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-top: 14px; }
  .add-contact-form input, .add-contact-form select {
    font-family: var(--sans); font-size: 13px; padding: 9px 12px; border: 1px solid var(--slate-100); border-radius: 6px; background: var(--white);
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--avaya-dark); color: var(--white); padding: 11px 22px; border-radius: 6px;
    font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display: none; align-items: center; gap: 8px; z-index: 100000; border-left: 4px solid var(--avaya-red);
  }
  .toast.show { display: flex; }
</style>
</head>
<body>

<!-- Login Overlay Screen -->
<div id="authScreen"></div>

<!-- Authenticated Application Workspace -->
<div id="appRoot" style="display:none;">
<div class="topbar">
  <div class="brand" onclick="openDashboard()">
    <div class="brand-mark">A</div>
    Sev-1 Notifier
    <span class="brand-sub">Avaya Enterprise Notification Suite</span>
  </div>
  <div class="topbar-right" id="topbarRight">
    <button class="nav-btn primary-nav" onclick="openDashboard()">📊 Dashboard</button>
    <button class="nav-btn" id="fetchIncidentBtn" onclick="openSearch()">🔍 Fetch Incident</button>
    <button class="nav-btn" id="changeNotifBtn" onclick="openChangeSearch()">🛠 Change Notification</button>
    <button class="nav-btn" id="recipientsBtn" onclick="openSettings()">⚙ Recipients</button>
    <div class="user-menu" id="userMenu"></div>
  </div>
</div>

<div class="shell" id="shell">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Active Queue</div>
      <div class="count-badge" id="incidentCount">0 open</div>
    </div>
    <div id="incidentList"></div>
  </div>

  <div class="main" id="mainPanel"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal Dialog Container -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modalMainTitle">⏰ Cadence Update Reminder</div>
    <div class="modal-sub" id="modalReminderText">SLA Timer elapsed. Please review technical updates and send the periodic status notification to customer stakeholders.</div>
    <div id="modalBtnContainer" style="display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn btn-secondary" onclick="closeModalReminder()">Snooze (5m)</button>
      <button class="btn btn-primary" onclick="acknowledgeReminderAndReview()">Review & Send Notification</button>
    </div>
  </div>
</div>

<script>
// Standalone Company Directory Data Store
let companyIdSeq = 1;

function renderAuthScreen() {

    <div class="auth-card">

        </div>

      <div class="auth-sub">Log in with your assigned SDM or Admin credentials.</div>
      <div class="auth-field-label">Username</div>
      <input type="text" class="auth-input" id="loginUsername" placeholder="Enter Username (e.g. samir.sinha or Admin)" value="">
      <div class="auth-field-label">Password</div>
      <input type="password" class="auth-input" id="loginPassword" placeholder="Enter Password" value="" onkeydown="if(event.key==='Enter') attemptLogin()">
      <div class="auth-error" id="loginError"></div>
      <button class="auth-btn" onclick="attemptLogin()">Sign In →</button>
    </div>
  `;
}

function attemptLogin() {
  const usernameInput = document.getElementById("loginUsername");
  const passwordInput = document.getElementById("loginPassword");
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  const errEl = document.getElementById("loginError");

  const user = USER_DIRECTORY[username];
  if (!user || user.password !== password) {
    errEl.textContent = "Invalid username or password."; return;
  }
  if (user.status === "revoked") {
    errEl.textContent = "Account revoked. Contact Administrator."; return;
  }

  usernameInput.value = "";
  passwordInput.value = "";
  errEl.textContent = "";

  completeLogin(user);
}

function completeLogin(user) {
  authState = { loggedIn: true, username: user.username, email: user.email, roleId: user.roleId, name: `${user.firstName} ${user.lastName}`, userId: user.id };
  currentView = "dashboard";
  
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  
  renderTopbarForRole();

  if (user.mustChangePassword) {
    openPasswordChangeModal(true);
  } else {
    showToast(`Welcome back, ${user.firstName}`);
    openDashboard();
  }

  renderSidebar();
  startCadenceScheduler();
}

function openPasswordChangeModal(isMandatory) {
  document.getElementById("modalMainTitle").textContent = "Update Password";
  
  let modalText = "Update your current login password.";
  if (isMandatory) modalText = "First Login Detected. Security policy requires you to update your temporary password before proceeding.";

  document.getElementById("modalReminderText").innerHTML = `
    <b>Password Reset Required:</b> ` + modalText + `<br><br>
    <div style="display:flex; flex-direction:column; gap:8px; text-align:left; margin-top:10px;">
      <label style="font-size:11px; font-weight:800;">NEW PASSWORD</label>
      <input type="password" id="modalNewPassword" style="padding:8px; border:1px solid var(--slate-100); border-radius:4px;" placeholder="Enter new password">
    </div>
  `;

  let btnHtml = "";
  if (!isMandatory) {
    btnHtml += `<button class="btn btn-secondary" onclick="closeModalReminder()">Cancel</button>`;
  }
  btnHtml += `<button class="btn btn-primary" onclick="submitPasswordChange('` + authState.username + `', ` + isMandatory + `)">Save New Password</button>`;
  
  document.getElementById("modalBtnContainer").innerHTML = btnHtml;
  document.getElementById("modalOverlay").style.display = "flex";
}

function submitPasswordChange(username, isMandatory) {
  const newPass = document.getElementById("modalNewPassword").value;
  if (!newPass) { showToast("Password cannot be blank."); return; }
  if (newPass.length < 6) { showToast("Password must be at least 6 characters long."); return; }

  const user = USER_DIRECTORY[username];
  if (user) {
    user.password = newPass;
    user.mustChangePassword = false;
    showToast("Password updated successfully.");
    closeModalReminder();
    if (isMandatory) openDashboard();
  }
}

  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.classList.remove("show"); }, 2400);
}

function toggleRecipient(contactId) {
  const st = STATE[currentId];
  if (st.selectedRecipients.has(contactId)) st.selectedRecipients.delete(contactId);
  else st.selectedRecipients.add(contactId);
  renderMain();
}

function runGenerate() {
  const inc = INCIDENTS.find(i => i.id === currentId);
  const st = STATE[inc.id];
  st.draft = generateDraft(inc);
  st.edited = {};
  st.activeChannel = "email";
  st.justSent = false;
  st.selectedRecipients = new Set();
  renderMain();
}

function switchChannel(ch) {
  const st = STATE[currentId];
  st.activeChannel = ch;
  st.selectedRecipients = new Set();
  renderMain();
}

function onEdit(el) {
  const st = STATE[currentId];
  st.edited[st.activeChannel] = el.innerText;
}

function sendNotification() {
  const inc = INCIDENTS.find(i => i.id === currentId);
  const st = STATE[inc.id];
  if (st.selectedRecipients.size === 0) return;

  const contacts = getContacts(inc.account);
  const names = [];
  contacts.forEach(c => {
    if (st.selectedRecipients.has(c.id)) names.push(c.name);
  });
  
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  st.sentLog.push({ time: timeStr, channel: st.activeChannel, recipientNames: names });
  st.justSent = true;

  inc.slaMinutes = (inc.severity === 'sev1') ? 30 : 60;
  inc.elapsedMinutes = 0;

  renderSidebar();
  renderMain();
  showToast(inc.severity.toUpperCase() + " Notification sent. " + inc.slaMinutes + "-min Cadence Timer restarted.");
}

function startCadenceScheduler() {
  setInterval(() => {
    INCIDENTS.forEach(inc => {
      inc.elapsedMinutes += 1;
      if (inc.elapsedMinutes >= inc.slaMinutes) {
        triggerCadenceReminderPopUp(inc);
      }
    });
    renderSidebar();
    if (currentView === "incident") renderMain();
  }, 60000);
}

function triggerCadenceReminderPopUp(inc) {
  activeReminderIncidentId = inc.id;
  document.getElementById("modalReminderText").innerHTML = 
    `<b>SLA Cadence Reminder:</b> The ` + inc.slaMinutes + `-minute timer for <b>` + inc.sourceRef + `</b> (` + inc.account + `) has elapsed.<br><br>Please review technical updates and send the periodic status notification to customer stakeholders.`;
  
  document.getElementById("modalMainTitle").textContent = "⏰ Cadence Update Reminder";
  
  let btnHtml = `
    <button class="btn btn-secondary" onclick="closeModalReminder()">Snooze (5m)</button>
    <button class="btn btn-primary" onclick="acknowledgeReminderAndReview()">Review & Send Notification</button>
  `;
  document.getElementById("modalBtnContainer").innerHTML = btnHtml;
  
  document.getElementById("modalOverlay").style.display = "flex";
}

  closeModalReminder();

}

  fetchSearchResults = null;
  renderMain();

  currentView = "search";

function executeFetchSearch() {
  const query = document.getElementById("fetchQueryInput").value.trim();
  if (!query) { showToast("Enter a search term."); return; }

  const queryLower = query.toLowerCase();
  const queryNormFL = normalizeFL(query);

  let results = [];

  if (fetchSourceMode === "MS") {
    results = SERVICENOW_CATALOG.filter(item => 
      item.sourceRef.toLowerCase().includes(queryLower) || 
      item.account.toLowerCase().includes(queryLower)
    );
  } else {
    results = SIEBEL_CATALOG.filter(item => 
      item.sourceRef.toLowerCase().includes(queryLower) || 
      (item.flId && normalizeFL(item.flId) === queryNormFL)
    );
    
    if (results.length === 0 && !queryLower.startsWith("sr-")) {
      const dynamicHits = fetchIncidentsFromReportAvaya(query);
      if (dynamicHits.length > 0) {
        results = dynamicHits;
        showToast("Retrieved active incidents from report.avaya.com");
      }
    }
  }

  fetchSearchResults = results;
  renderMain();
}

function populateIncidentToActiveQueue(sourceRef) {
  let item = null;
  fetchSearchResults.forEach(i => {
    if (i.sourceRef === sourceRef) item = i;
  });
  if (!item) return;

  let exists = false;
  INCIDENTS.forEach(i => {
    if (i.sourceRef === sourceRef) exists = true;
  });
  if (exists) {
    showToast("Incident is already populated in Active Queue."); return;
  }

  const newInc = {
    id: "inc-" + Date.now(),
    source: (fetchSourceMode === "MS" ? "servicenow" : "report.avaya.com"),
    sourceRef: item.sourceRef,
    severity: item.severity,
    title: item.title,
    affectedService: item.affectedService,
    account: item.account,
    owner: authState.name,
    status: item.status,
    startTime: item.startTime,
    slaMinutes: item.slaMinutes,
    elapsedMinutes: 0,
    flId: item.flId || null
  };

  INCIDENTS.unshift(newInc);
  STATE[newInc.id] = { draft: null, sentLog: [], activeChannel: "email", edited: {}, selectedRecipients: new Set() };
  currentId = newInc.id;
  currentView = "incident";
  
  showToast("Populated " + item.sourceRef + " into Active Queue");
  renderSidebar();
  renderMain();
}

    <div class="card">
      <div class="card-header"><div class="card-label">User Provisioning & Customer Allocations</div></div>
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">FIRST NAME *</label>
          <input type="text" id="usrFirstName" placeholder="First Name" style="width:100%; padding:9px; border:1px solid var(--slate-100); border-radius:6px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">LAST NAME *</label>
          <input type="text" id="usrLastName" placeholder="Last Name" style="width:100%; padding:9px; border:1px solid var(--slate-100); border-radius:6px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">EMAIL ID *</label>
          <input type="email" id="usrEmail" placeholder="email@avaya.com" style="width:100%; padding:9px; border:1px solid var(--slate-100); border-radius:6px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">PHONE / MOBILE (OPTIONAL)</label>
          <input type="text" id="usrPhone" placeholder="+91 / E.164 format" style="width:100%; padding:9px; border:1px solid var(--slate-100); border-radius:6px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">CREATE TEMPORARY PASSWORD *</label>
          <input type="password" id="usrPassword" placeholder="Initial Password" style="width:100%; padding:9px; border:1px solid var(--slate-100); border-radius:6px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:800; color:var(--slate-500);">ASSIGNED CUSTOMERS (MULTIPLE SELECT)</label>
          <select id="usrCustomerSelect" multiple style="width:100%; padding:6px; border:1px solid var(--slate-100); border-radius:6px; height:80px;">
            ` + selectOpts + `
          </select>
        </div>
      </div>

      <button class="btn btn-primary" onclick="adminProvisionNewUser()">Register User (Forces First Login Password Change)</button>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-label">Registered Users & Customer Allocations</div></div>
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="text-align:left; font-size:11px; color:var(--slate-500); border-bottom:1px solid var(--slate-100);">
            <th style="padding:6px;">USER DETAILS</th>
            <th style="padding:6px;">ROLE</th>
            <th style="padding:6px;">ASSIGNED CUSTOMERS</th>
          </tr>
        </thead>
        <tbody>
          ` + userRows + `
        </tbody>
      </table>
    </div>
  `;
}

function adminProvisionNewUser() {
  const fName = document.getElementById("usrFirstName").value.trim();
  const lName = document.getElementById("usrLastName").value.trim();
  const email = document.getElementById("usrEmail").value.trim();
  const phone = document.getElementById("usrPhone").value.trim();
  const pwd = document.getElementById("usrPassword").value;
  
  const selectEl = document.getElementById("usrCustomerSelect");
  const selectedCustomers = [];
  for (let i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].selected) {
      selectedCustomers.push(selectEl.options[i].value);
    }
  }

  let missing = false;
  if (!fName) missing = true;
  if (!lName) missing = true;
  if (!email) missing = true;
  if (!pwd) missing = true;

  if (missing) {
    showToast("Fill in required user details."); return;
  }

  const username = email.split('@')[0];

  USER_DIRECTORY[username] = {
    id: userIdSeq++,
    username: username,
    password: pwd,
    firstName: fName,
    lastName: lName,
    email: email,
    phone: phone,
    roleId: "role-sdm",
    status: "active",
    mustChangePassword: true,
    isSuperAdmin: false,
    mappedCompanies: selectedCustomers
  };

  showToast("Registered User " + fName + " " + lName + ". User will be forced to change password at first login.");
  renderMain();
}

function adminUnmapCompany(username, companyName) {
  const usr = USER_DIRECTORY[username];
  let newMaps = [];
  usr.mappedCompanies.forEach(c => {
    if (c !== companyName) newMaps.push(c);
  });
  usr.mappedCompanies = newMaps;
  showToast("Unmapped " + companyName + " from " + usr.firstName);
  renderMain();
}

// Guaranteed App Boot Sequence
renderAuthScreen();

</script>
</body>
</html>
